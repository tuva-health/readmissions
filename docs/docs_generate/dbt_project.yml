name: 'lean_input'
version: '1.0.0'
config-version: 2

profile: 'default'



vars:
  terminology_enabled: false
  readmissions_condition_override: "{{ref('condition')}}"
  readmissions_patient_override:   "{{ref('patient')}}"
  readmissions_encounter_override: "{{ref('encounter')}}"
  readmissions_procedure_override: "{{ref('procedure')}}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["documents"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  lean_input:
    +materialized: view