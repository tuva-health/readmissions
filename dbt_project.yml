name: 'readmissions'
version: '0.1.0'
config-version: 2
require-dbt-version: ">=1.10.0"

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'

seeds:
  readmissions:
    value_sets:
      readmissions:
        readmissions__acute_diagnosis_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__acute_diagnosis_ccs.csv', true, true, true) }}"
        readmissions__acute_diagnosis_icd_10_cm:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__acute_diagnosis_icd_10_cm.csv', true, true, true) }}"
        readmissions__always_planned_ccs_diagnosis_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__always_planned_ccs_diagnosis_category.csv', true, true, true) }}"
        readmissions__always_planned_ccs_procedure_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__always_planned_ccs_procedure_category.csv', true, true, true) }}"
        readmissions__exclusion_ccs_diagnosis_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__exclusion_ccs_diagnosis_category.csv', true, true, true) }}"
        readmissions__icd_10_cm_to_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__icd_10_cm_to_ccs.csv', true, true, true) }}"
        readmissions__icd_10_pcs_to_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__icd_10_pcs_to_ccs.csv', true, true, true) }}"
        readmissions__potentially_planned_ccs_procedure_category:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__potentially_planned_ccs_procedure_category.csv', true, true, true) }}"
        readmissions__potentially_planned_icd_10_pcs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__potentially_planned_icd_10_pcs.csv', true, true, true) }}"
        readmissions__specialty_cohort:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__specialty_cohort.csv', true, true, true) }}"
        readmissions__surgery_gynecology_cohort:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/readmissions/' ~ var('readmissions_seed_version', '1.0.0'), 'readmissions__surgery_gynecology_cohort.csv', true, true, true) }}"
